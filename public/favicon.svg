<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="lensL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2e"/>
      <stop offset="45%" stop-color="#162840"/>
      <stop offset="100%" stop-color="#0a1520"/>
    </linearGradient>
    <linearGradient id="lensR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2e"/>
      <stop offset="45%" stop-color="#162840"/>
      <stop offset="100%" stop-color="#0a1520"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c84a"/>
      <stop offset="50%" stop-color="#c9a014"/>
      <stop offset="100%" stop-color="#a07c00"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="50%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clipL">
      <rect x="4" y="22" width="24" height="18" rx="5"/>
    </clipPath>
    <clipPath id="clipR">
      <rect x="36" y="22" width="24" height="18" rx="5"/>
    </clipPath>
  </defs>

  <!-- Left temple arm -->
  <line x1="4" y1="26" x2="4" y2="38" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Right temple arm -->
  <line x1="60" y1="26" x2="60" y2="38" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Left lens fill -->
  <rect x="4" y="22" width="24" height="18" rx="5" fill="url(#lensL)"/>
  <!-- Left lens shine -->
  <rect x="6" y="24" width="10" height="5" rx="2.5" fill="url(#shine)"/>
  <!-- Left lens frame -->
  <rect x="4" y="22" width="24" height="18" rx="5" stroke="url(#gold)" stroke-width="2"/>

  <!-- Right lens fill -->
  <rect x="36" y="22" width="24" height="18" rx="5" fill="url(#lensR)"/>
  <!-- Right lens shine -->
  <rect x="38" y="24" width="10" height="5" rx="2.5" fill="url(#shine)"/>
  <!-- Right lens frame -->
  <rect x="36" y="22" width="24" height="18" rx="5" stroke="url(#gold)" stroke-width="2"/>

  <!-- Bridge -->
  <path d="M28 29 C30 26 34 26 36 29" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Left nose pad detail -->
  <circle cx="28" cy="32" r="1.2" fill="url(#gold)" opacity="0.8"/>
  <!-- Right nose pad detail -->
  <circle cx="36" cy="32" r="1.2" fill="url(#gold)" opacity="0.8"/>
</svg>
